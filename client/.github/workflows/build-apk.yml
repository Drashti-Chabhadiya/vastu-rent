name: Build and Sync APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./client

      - name: Build Web App & Sync Capacitor
        run: |
          pnpm run build
          npx cap sync android
        working-directory: ./client

      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: ./client/android

      - name: Move APK to Public Folder
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk public/app-release.apk
        working-directory: ./client

      - name: Commit and Push Updated APK
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add client/public/app-release.apk
          git diff-index --quiet HEAD || git commit -m "chore: auto-compile latest APK [skip ci]"
          git push
